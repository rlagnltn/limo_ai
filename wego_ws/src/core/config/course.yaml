core:
  ros__parameters:
    enabled: true
    start_stage: 1
    stop_after_stage: false
    input_timeout: 0.5
    detection_timeout: 1.0
    sign_timeout: 0.5
    min_confidence: 0.7
    confirm_frames: 1
    # Areas in image pixels, ordered by YOLO class IDs 0..7.
    class_min_areas: [9000.0, 9000.0, 4400.0, 4400.0, 4100.0, 5000.0, 3500.0, 26000.0]

yolo_object_detection_node:
  ros__parameters:
    canonical_class_names: [red_light, green_light, left_sign, right_sign, pedestrian_sign, slow_sign, parking_sign, traffic_cone]
